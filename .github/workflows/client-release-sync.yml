name: Client Release sync

on:
  release:
    types: [published]
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      forks_only:
        description: '只同步本方两个 fork，不导入上游'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: client-release-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: vars.GITGUD_RELEASE_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          persist-credentials: false
      - name: Validate release synchronization
        run: python3 -m unittest discover -s scripts/ci -p 'test_sync_client_releases.py' -v
      - name: Import upstream and synchronize fork releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITGUD_RELEASE_TOKEN: ${{ secrets.GITGUD_RELEASE_TOKEN }}
          RELEASE_PROJECT: ${{ vars.GITGUD_RELEASE_PROJECT }}
          UPSTREAM_PROJECT: ${{ vars.GITGUD_RELEASE_UPSTREAM_PROJECT }}
          FORKS_ONLY: ${{ inputs.forks_only || false }}
        run: |
          set -eu
          test -n "$GITGUD_RELEASE_TOKEN"
          test -n "$UPSTREAM_PROJECT"
          test "$RELEASE_PROJECT" -ne "$UPSTREAM_PROJECT"
          source_args=()
          if [ "$FORKS_ONLY" != 'true' ]; then
            source_args=(--upstream-project "$UPSTREAM_PROJECT")
          fi
          python3 scripts/ci/sync_client_releases.py \
            --github "$GITHUB_REPOSITORY" --gitgud-project "$RELEASE_PROJECT" \
            "${source_args[@]}" \
            --cache "$RUNNER_TEMP/client-releases" \
            --receipt "$RUNNER_TEMP/client-release-sync.json" --apply
      - name: Keep synchronization receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-release-sync
          path: ${{ runner.temp }}/client-release-sync.json
          if-no-files-found: ignore
