name: Repository sync
on:
  push:
    branches: [master]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-sync-master
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.repository == 'Cec1c/ServerS5A3' && vars.GITGUD_MIRROR_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fast-forward the asynchronous GitGud mirror
        env:
          GITGUD_MIRROR_TOKEN: ${{ secrets.GITGUD_SOURCE_MIRROR_TOKEN }}
          MIRROR: ${{ vars.GITGUD_MIRROR_REPOSITORY }}
        run: |
          test -n "$GITGUD_MIRROR_TOKEN"
          python3 scripts/ci/sync_repositories.py --github "https://github.com/${{ github.repository }}.git" --gitgud "$MIRROR" --apply
