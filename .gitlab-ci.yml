workflow:
  rules:
    - when: always
stages: [test]
semgrep-runtime-probe:
  stage: test
  image: registry.gitlab.com/security-products/semgrep:6
  timeout: 20m
  cache: []
  dependencies: []
  variables:
    EIO_BACKEND: posix
  script:
    - /analyzer run
    - python3 -c "import json; r=json.load(open('gl-sast-report.json')); assert r['scan']['status']=='success'; print('SAST scan success; vulnerabilities',len(r['vulnerabilities']))"
  artifacts:
    when: always
    paths: [gl-sast-report.json]
    expire_in: 7 days
