workflow:
  rules:
    - when: always
stages: [test]
semgrep-runtime-probe:
  stage: test
  image: registry.gitlab.com/security-products/semgrep:6
  timeout: 10m
  cache: []
  dependencies: []
  variables:
    SEMGREP_SEND_METRICS: "off"
  script:
    - python3 -c "import base64; exec(base64.b64decode(''))"
