[General]
; 设为 1 启用插件。修改后需要重启客户端。
Enabled=1
; 设为 1 将诊断信息写入 DpsMeter.log。
Debug=0
; 独立 Win32 DPS 窗口的可选显示快捷键。开关时聊天栏提示「DPS已开启/已关闭」。
; 支持 Ctrl、Alt、Shift 或 Win 搭配 A-Z、0-9、F1-F24 及常用按键。
; 官方 DPS 界面没有显示快捷键，因此默认值为 None。
WindowHotkey=None
; 设为 1 时鼠标输入会穿透 DPS 窗口，同时无法拖动窗口。
ClickThrough=0
; 设为 1 使用官方初始位置：X=25*缩放比例，Y=客户端高度的 22%。
; 拖动面板后会自动改为 0，并保存 OffsetX 和 OffsetY。
AutoPosition=1
; 相对于游戏客户区左上角的手动位置。
OffsetX=24
OffsetY=120
; 在分辨率缩放之上再乘的百分比，有效范围为 75-150。
; 面板基础尺寸已按较小默认外观设定。16:9 / 16:10 按高度对齐 1600x900，4:3 按较宽基准，约为同分辨率下 1.2 倍。
Scale=100
